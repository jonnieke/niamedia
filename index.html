<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nia Media | Video Commercials for Kenyan SMEs</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nia Media" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- SEO / Open Graph -->
    <meta name="description" content="Affordable AI-assisted video commercials, campaign ideas, voiceovers, posters, and jingles for Kenyan and East African businesses. Starting at KES 3,500." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://niamedia.co.ke/" />
    <meta name="keywords" content="video commercial Kenya, promo video Nairobi, video production Kenya, SME advertising Kenya, social media video Kenya, TikTok ads Kenya, Instagram ads Kenya" />
    <meta property="og:title" content="Nia Media - Video Commercials for East African Businesses" />
    <meta property="og:description" content="Professional 15s-3min video commercials and promo posters. Get an instant quote in 60 seconds. Starting at KES 3,500." />
    <meta property="og:image" content="https://niamedia.co.ke/images/og-image.jpg" />
    <meta property="og:url" content="https://niamedia.co.ke" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_KE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nia Media - Video Commercials for East African Businesses" />
    <meta name="twitter:description" content="Professional video commercials for Kenyan and East African SMEs from KES 3,500." />
    <meta name="twitter:image" content="https://niamedia.co.ke/images/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured data: Organization + WebSite + Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://niamedia.co.ke/#org",
          "name": "Nia Media",
          "url": "https://niamedia.co.ke",
          "logo": "https://niamedia.co.ke/icon-512.svg",
          "description": "Nia Media produces video commercials, promo posters, and AI-powered campaign support for SMEs across Kenya and East Africa.",
          "foundingLocation": { "@type": "Place", "name": "Nairobi, Kenya" },
          "areaServed": ["Kenya", "East Africa"],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+254751822556",
            "contactType": "customer service",
            "availableLanguage": ["English", "Swahili"]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://niamedia.co.ke/#website",
          "url": "https://niamedia.co.ke",
          "name": "Nia Media",
          "publisher": { "@id": "https://niamedia.co.ke/#org" },
          "inLanguage": "en-KE"
        },
        {
          "@type": "Service",
          "@id": "https://niamedia.co.ke/#video-service",
          "name": "Video Commercial Production",
          "provider": { "@id": "https://niamedia.co.ke/#org" },
          "serviceType": "Video Commercial Production",
          "description": "Short video commercials for SMEs in 15s, 30s, 60s, 90s, and 3+ minute formats.",
          "areaServed": ["Kenya", "East Africa"],
          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "KES",
            "lowPrice": "3500",
            "highPrice": "60000"
          }
        }
      ]
    }
    </script>

    <!-- Structured data: FAQ (matches homepage FAQ section) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much does a video commercial cost in Kenya?",
          "acceptedAnswer": { "@type": "Answer", "text": "Nia Media video commercials start at KES 3,500 for a 15-second promo and range up to KES 60,000 for 3-minute-plus infomercials. An instant online quote is available at niamedia.co.ke/quote — no account or phone call needed." }
        },
        {
          "@type": "Question",
          "name": "How fast can a video commercial be delivered in Kenya?",
          "acceptedAnswer": { "@type": "Answer", "text": "Standard delivery is 3–5 business days once the brief and assets are received. 48-hour rush (+25%) and 24-hour rush (+50%) options are available." }
        },
        {
          "@type": "Question",
          "name": "Does Nia Media accept M-Pesa?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Nia Media accepts M-Pesa, Visa, and Mastercard through PesaPal secure checkout. Clients pay a deposit to start production and the balance on delivery." }
        },
        {
          "@type": "Question",
          "name": "Do I need to visit a studio to get a video commercial made?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Most commercials are produced remotely — clients send their brief, photos, and brand materials via WhatsApp or the online form. Where filming is needed, Nia Media arranges it." }
        },
        {
          "@type": "Question",
          "name": "What do I get when the video is delivered?",
          "acceptedAnswer": { "@type": "Answer", "text": "The final video optimised for chosen platforms (TikTok, Instagram, WhatsApp, Facebook, YouTube) with full exclusive rights. Add-ons include matching promo posters, subtitles, and AI-generated campaign copy in English or Kiswahili." }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
