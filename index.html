    <script type="application/ld+json">

          "foundingLocation": { "@type": "Place", "name": "Nairobi, Kenya" },
          "areaServed": ["Kenya", "East Africa"],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+254751822556",
            "contactType": "customer service",
            "availableLanguage": ["English", "Swahili"]
          },
          "sameAs": []
        },
        {
          "@type": "Service",
          "@id": "https://niamedia.co.ke/#video-service",
          "name": "Video Commercial Production",

          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "KES",

            "highPrice": "60000"

          "@type": "Service",

            "@type": "Offer",

            "price": "500",
            "description": "Per campaign credit"
          }
        }
      ]
    }
